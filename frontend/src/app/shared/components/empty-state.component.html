<div class="sb-empty-state">
  <mat-icon class="sb-empty-state__icon">{{ icon() }}</mat-icon>
  <p class="sb-empty-state__title">{{ title() }}</p>
  @if (message()) {
    <p class="sb-empty-state__message">{{ message() }}</p>
  }
  @if (actionLabel()) {
    <button mat-stroked-button type="button" (click)="action.emit()">{{ actionLabel() }}</button>
  }
</div>
